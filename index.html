<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Khu vực chọn file */
        .upload-box {
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
        }

        .upload-box input {
            display: none;
        }

        .upload-button {
            display: inline-block;
            background: #00c6ff;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .upload-button:hover {
            background: #0072ff;
        }

        /* Player */
        .player {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: center;
        }

        .cover {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 15px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
        }

        #songTitle {
            font-size: 24px;
            margin-bottom: 8px;
        }

        #songInfo {
            color: #ccc;
            margin-bottom: 20px;
        }

        /* Thanh tiến trình */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-container input {
            flex: 1;
        }

        /* Nút điều khiển */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
        }

        .controls button {
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        .controls button:hover {
            background: #00aaff;
        }

        .controls .play {
            width: 65px;
            height: 65px;
            background: #00aaff;
            font-size: 25px;
        }

        .volume {
            margin-top: 20px;
        }

        /* Danh sách */
        .playlist {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
        }

        .playlist h2 {
            margin-bottom: 15px;
        }

        .song {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.08);
            cursor: pointer;
        }

        .song:hover {
            background: rgba(255,255,255,0.18);
        }

        .song.active {
            background: rgba(0,170,255,0.4);
        }

        .song-number {
            width: 30px;
            text-align: center;
        }

        .song-name {
            flex: 1;
        }

        .delete {
            background: #ff4757;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 7px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 20px;
        }

        input[type="range"] {
            accent-color: #00aaff;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .player {
                padding: 20px;
            }

            .cover {
                width: 140px;
                height: 140px;
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎵 My Music Player</h1>

    <!-- Chọn nhạc -->
    <div class="upload-box">
        <h2>Thêm nhạc</h2>
        <p style="margin: 10px 0 20px;">
            Chọn một hoặc nhiều file nhạc từ máy của bạn
        </p>

        <label class="upload-button">
            📁 Chọn file nhạc
            <input type="file" id="fileInput" accept="audio/*" multiple>
        </label>
    </div>

    <!-- Trình phát -->
    <div class="player">

        <div class="cover">
            🎵
        </div>

        <h2 id="songTitle">Chưa có bài hát</h2>

        <p id="songInfo">Hãy thêm một file nhạc</p>

        <!-- Thanh thời gian -->
        <div class="progress-container">
            <span id="currentTime">0:00</span>

            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
            >

            <span id="duration">0:00</span>
        </div>

        <!-- Nút điều khiển -->
        <div class="controls">

            <button onclick="previousSong()">
                ⏮
            </button>

            <button class="play" onclick="togglePlay()" id="playButton">
                ▶
            </button>

            <button onclick="nextSong()">
                ⏭
            </button>

        </div>

        <!-- Âm lượng -->
        <div class="volume">
            🔊
            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >
        </div>

    </div>

    <!-- Playlist -->
    <div class="playlist">

        <h2>📋 Danh sách bài hát</h2>

        <div id="playlist">
            <div class="empty">
                Chưa có bài hát nào
            </div>
        </div>

    </div>

</div>


<audio id="audio"></audio>


<script>

    // ==========================
    // BIẾN
    // ==========================

    const fileInput = document.getElementById("fileInput");
    const audio = document.getElementById("audio");

    const songTitle = document.getElementById("songTitle");
    const songInfo = document.getElementById("songInfo");

    const playlistElement = document.getElementById("playlist");

    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");

    const currentTimeElement =
        document.getElementById("currentTime");

    const durationElement =
        document.getElementById("duration");

    const playButton =
        document.getElementById("playButton");


    let songs = [];
    let currentIndex = -1;


    // ==========================
    // THÊM FILE NHẠC
    // ==========================

    fileInput.addEventListener("change", function(event) {

        const files = Array.from(event.target.files);

        files.forEach(file => {

            const song = {
                file: file,

                // Tên mặc định lấy từ tên file
                name: file.name.replace(/\.[^/.]+$/, ""),

                url: URL.createObjectURL(file)
            };

            songs.push(song);

        });

        renderPlaylist();

        // Nếu chưa có bài nào đang phát
        if (currentIndex === -1 && songs.length > 0) {

            loadSong(0);

        }

        // Cho phép chọn lại cùng một file
        fileInput.value = "";

    });


    // ==========================
    // HIỂN THỊ PLAYLIST
    // ==========================

    function renderPlaylist() {

        playlistElement.innerHTML = "";

        if (songs.length === 0) {

            playlistElement.innerHTML = `
                <div class="empty">
                    Chưa có bài hát nào
                </div>
            `;

            return;
        }


        songs.forEach((song, index) => {

            const div = document.createElement("div");

            div.className =
                "song " +
                (index === currentIndex ? "active" : "");


            div.innerHTML = `

                <div class="song-number">
                    ${index + 1}
                </div>

                <div class="song-name">
                    ${escapeHTML(song.name)}
                </div>

                <button class="delete"
                    onclick="deleteSong(event, ${index})">
                    Xóa
                </button>

            `;


            div.addEventListener("click", function() {

                loadSong(index);
                playSong();

            });


            playlistElement.appendChild(div);

        });

    }


    // ==========================
    // LOAD BÀI HÁT
    // ==========================

    function loadSong(index) {

        if (songs.length === 0) return;

        currentIndex = index;

        const song = songs[index];

        audio.src = song.url;

        songTitle.textContent = song.name;

        songInfo.textContent =
            song.file.name;


        progress.value = 0;

        currentTimeElement.textContent = "0:00";

        durationElement.textContent = "0:00";

        renderPlaylist();

    }


    // ==========================
    // PHÁT NHẠC
    // ==========================

    function playSong() {

        if (currentIndex === -1) return;

        audio.play();

        playButton.textContent = "⏸";

    }


    // ==========================
    // PAUSE / PLAY
    // ==========================

    function togglePlay() {

        if (currentIndex === -1) {

            if (songs.length > 0) {

                loadSong(0);
                playSong();

            }

            return;
        }


        if (audio.paused) {

            playSong();

        } else {

            audio.pause();

            playButton.textContent = "▶";

        }

    }


    // ==========================
    // BÀI TIẾP THEO
    // ==========================

    function nextSong() {

        if (songs.length === 0) return;

        let nextIndex =
            (currentIndex + 1) % songs.length;

        loadSong(nextIndex);

        playSong();

    }


    // ==========================
    // BÀI TRƯỚC
    // ==========================

    function previousSong() {

        if (songs.length === 0) return;

        let previousIndex =
            (currentIndex - 1 + songs.length)
            % songs.length;

        loadSong(previousIndex);

        playSong();

    }


    // ==========================
    // XÓA BÀI
    // ==========================

    function deleteSong(event, index) {

        event.stopPropagation();

        URL.revokeObjectURL(songs[index].url);

        songs.splice(index, 1);


        if (songs.length === 0) {

            audio.pause();

            audio.src = "";

            currentIndex = -1;

            songTitle.textContent =
                "Chưa có bài hát";

            songInfo.textContent =
                "Hãy thêm một file nhạc";

            playButton.textContent = "▶";

        }

        else if (index === currentIndex) {

            currentIndex = -1;

            loadSong(
                Math.min(index, songs.length - 1)
            );

        }

        else if (index < currentIndex) {

            currentIndex--;

        }


        renderPlaylist();

    }


    // ==========================
    // THANH TIẾN TRÌNH
    // ==========================

    audio.addEventListener("timeupdate", function() {

        if (!audio.duration) return;

        const percent =
            (audio.currentTime / audio.duration) * 100;

        progress.value = percent;

        currentTimeElement.textContent =
            formatTime(audio.currentTime);

    });


    audio.addEventListener("loadedmetadata", function() {

        durationElement.textContent =
            formatTime(audio.duration);

    });


    progress.addEventListener("input", function() {

        if (!audio.duration) return;

        audio.currentTime =
            (progress.value / 100) * audio.duration;

    });


    // ==========================
    // ÂM LƯỢNG
    // ==========================

    volume.addEventListener("input", function() {

        audio.volume = volume.value;

    });


    // ==========================
    // TỰ ĐỘNG CHUYỂN BÀI
    // ==========================

    audio.addEventListener("ended", function() {

        nextSong();

    });


    // ==========================
    // FORMAT THỜI GIAN
    // ==========================

    function formatTime(seconds) {

        if (isNaN(seconds)) return "0:00";

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            Math.floor(seconds % 60);

        return minutes + ":" +
            String(secs).padStart(2, "0");

    }


    // ==========================
    // CHỐNG HTML TRONG TÊN FILE
    // ==========================

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }

</script>

</body>
</html>
